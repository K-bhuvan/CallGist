[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "callgist"
version = "0.2.0"
description = "Weekly call intelligence for home-service owners"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CallGist"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Business",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.40.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "sendgrid>=6.11.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[project.scripts]
callgist-analyze = "scripts.run_analysis:main"
callgist-report = "scripts.generate_sample_report:main"
callgist-validate = "scripts.ground_truth_review:main"
callgist-pipeline = "scripts.run_pipeline:main"

[project.urls]
Repository = "https://github.com/callgist/columbus"

[tool.setuptools.packages.find]
include = ["core", "scripts"]
exclude = ["tests*", "data*", "outputs*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.coverage.run]
source = ["core"]
omit = ["tests/*", "core/transcription.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstract",
]
